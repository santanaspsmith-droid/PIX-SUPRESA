<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pai, manda um Pix? 💸</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(135deg,#d8fce8,#b7e4ff);font-family:Arial,sans-serif;overflow:hidden;color:#173b35}.card{width:min(92vw,440px);padding:36px 22px;border-radius:24px;background:#ffffffed;text-align:center;box-shadow:0 15px 45px #164c3b25}h1{font-size:clamp(25px,6vw,34px);margin:12px 0 14px}.emoji{font-size:58px}.sub{color:#55716a}.actions{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:28px;min-height:70px}button{border:0;border-radius:14px;padding:16px 30px;font-size:18px;font-weight:800;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 15px #0002}#yes{background:#20bb72;color:white}#no{background:#ff5575;color:white;transition:left .16s ease,top .16s ease;z-index:10}#message{display:none;font-size:23px;line-height:1.5}#message strong{color:#11965a}
</style>
</head>
<body>
<main class="card"><div class="emoji">💸🥹</div><div id="question"><h1>Pai, manda um Pix de 200? 💚</h1><p class="sub">Prometo que é por uma boa causa! 😂</p><div class="actions"><button id="yes">SIM ✅</button><button id="no">NÃO ❌</button></div></div><div id="message"><strong>Valeu, paizão! 😍💚</strong><p>Sabia que podia contar com você! 💸😂</p><p>Te amo! ❤️</p></div></main>
<script>
const no=document.getElementById('no');const yes=document.getElementById('yes');let escaped=false;
function flee(){const w=no.offsetWidth,h=no.offsetHeight,pad=12;const x=pad+Math.random()*Math.max(0,innerWidth-w-pad*2);const y=pad+Math.random()*Math.max(0,innerHeight-h-pad*2);no.style.position='fixed';no.style.left=x+'px';no.style.top=y+'px';escaped=true;}
no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')flee()});no.addEventListener('pointerdown',e=>{e.preventDefault();flee()});no.addEventListener('click',e=>{e.preventDefault();flee()});yes.addEventListener('click',()=>{document.getElementById('question').style.display='none';no.style.display='none';document.getElementById('message').style.display='block'});
</script>
</body></html>
