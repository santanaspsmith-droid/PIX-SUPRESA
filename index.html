<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pai, manda um Pix? 💸</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#d6fbe9,#e9fff5);font-family:system-ui,-apple-system,Arial,sans-serif;color:#164638;padding:22px;overflow:hidden}.card{width:min(100%,440px);background:white;border-radius:26px;padding:32px 22px;text-align:center;box-shadow:0 16px 55px #125c3722}h1{font-size:clamp(25px,6vw,35px);line-height:1.2}p{color:#537267}.buttons{display:flex;justify-content:center;align-items:center;gap:16px;min-height:90px;flex-wrap:wrap}button,.send{border:0;border-radius:14px;padding:15px 25px;font-weight:800;font-size:17px;cursor:pointer;touch-action:manipulation}#yes,.send{background:#16b76c;color:white}#no{background:#ff5277;color:white;position:relative;z-index:5;transition:left .15s,top .15s}.send{display:inline-block;text-decoration:none;margin-top:15px;max-width:100%}.hidden{display:none}#result h2{font-size:26px}
</style>
</head>
<body><main class="card"><section id="question"><div style="font-size:52px">💸🥹</div><h1>Pai, manda um Pix de R$ 200? 💚</h1><p>Prometo que é por uma boa causa! 😂</p><div class="buttons"><button id="yes">SIM ✅</button><button id="no">NÃO ❌</button></div></section><section id="result" class="hidden"><div style="font-size:54px">🎉💸</div><h2>Valeu, paizão! 😂💚</h2><p>Sabia que podia contar com você!</p><a id="send" class="send" target="_blank" rel="noopener noreferrer">📲 Enviar confirmação no WhatsApp</a><p style="font-size:13px">O WhatsApp abrirá com a mensagem pronta. É só tocar em enviar.</p></section></main>
<script>
const no=document.getElementById('no');
function escapeButton(){const rect=no.getBoundingClientRect();const pad=12;const w=rect.width,h=rect.height;const x=pad+Math.random()*Math.max(0,innerWidth-w-pad*2);const y=pad+Math.random()*Math.max(0,innerHeight-h-pad*2);no.style.position='fixed';no.style.left=x+'px';no.style.top=y+'px';}
no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')escapeButton()});no.addEventListener('pointerdown',e=>{e.preventDefault();escapeButton()});no.addEventListener('click',e=>{e.preventDefault();escapeButton()});
document.getElementById('yes').addEventListener('click',()=>{document.getElementById('question').classList.add('hidden');no.style.display='none';document.getElementById('result').classList.remove('hidden');const msg='Manda seu Pix filha 😂💚';document.getElementById('send').href='https://wa.me/5571993099482?text='+encodeURIComponent(msg)});
</script></body></html>
